<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// binalar.js eksik/eski sürümse boş liste kullan (çökme engelle)
const ONEMLI_L = (typeof ONEMLI_BINALAR === 'undefined') ? [] : ONEMLI_BINALAR;
const ARKA_L = (typeof ARKA_PLAN_BINALAR === 'undefined') ? [] : ARKA_PLAN_BINALAR;
const PARK_L = (typeof PARKLAR === 'undefined') ? [] : PARKLAR;
const YOL_L = (typeof YOLLAR === 'undefined') ? [] : YOLLAR;
const FISK_L = (typeof FISKIYELER === 'undefined') ? [] : FISKIYELER;
const SPOR_L = (typeof SPOR_ALANLARI === 'undefined') ? [] : SPOR_ALANLARI;

// ===== AYARLAR ================================================================
const HIZ_MS          = 25;      // uçağın sabit ileri hızı (m/s)
const DONUS_KAZANCI   = 1.1;     // roll(°) başına dönüş hızı (°/s)
const TIRMANIS_KAZANCI= 0.55;    // pitch(°) başına dikey hız (m/s)
const EMA_ALFA        = 0.15;    // sensör yumuşatma (0-1, küçük = daha yumuşak)
const DEADBAND_DERECE = 2;       // ±ölü bant
const SINIR_YARICAP   = 1300;    // uçuş sınırı (kampüs merkezinden, m)
const YURUT_PITCH     = 1;       // -1 yaparsan pitch terslenir (sensör yönüne göre)
const YURUT_ROLL      = 1;       // -1 yaparsan roll terslenir

// ===== SAHNE ==================================================================
const kapsayici = document.getElementById('sahne');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
kapsayici.appendChild(renderer.domElement);

const sahne = new THREE.Scene();
const GOKYUZU = 0x87b7d8;
sahne.background = new THREE.Color(GOKYUZU);
sahne.fog = new THREE.Fog(GOKYUZU, 500, 2400);

const kamera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
sahne.add(new THREE.AmbientLight(0xffffff, 0.7));
const gunes = new THREE.DirectionalLight(0xfff4e0, 1.6);
gunes.position.set(400, 700, 300);
sahne.add(gunes);

// Zemin + grid
const zemin = new THREE.Mesh(
  new THREE.CircleGeometry(2800, 64),
  new THREE.MeshLambertMaterial({ color: 0x4a7c43 })
);
zemin.rotation.x = -Math.PI / 2;
sahne.add(zemin);
const grid = new THREE.GridHelper(2800, 56, 0xffffff, 0x689b5e);
grid.material.opacity = 0.25; grid.material.transparent = true;
sahne.add(grid);

// ===== KATMAN GRUPLARI (sağ alttaki panelden aç/kapa) ==========================
const katman = {};
for (const ad of ['bina', 'etiket', 'arka', 'yol', 'park', 'spor', 'fiskiiye']) {
  katman[ad] = new THREE.Group();
  sahne.add(katman[ad]);
}
document.querySelectorAll('#katmanlar input[data-katman]').forEach((kutucuk) => {
  kutucuk.onchange = () => { katman[kutucuk.dataset.katman].visible = kutucuk.checked; };
});

// Düz zemin katmanları için titreme önleyici malzeme: polygonOffset +
// renderOrder + depthWrite:false → çakışan zeminler derinlik kavgasına
// girmez, üst üste binme sırası sabitlenir (veri aynen korunur).
function zeminMalzeme(renk, faktor, vertexRenk = false) {
  return new THREE.MeshLambertMaterial({
    color: renk, vertexColors: vertexRenk, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: faktor, polygonOffsetUnits: faktor,
  });
}

// ===== PARKLAR (düz poligonlar, yere koyulur) ================================
for (const p of PARK_L) {
  if (!p.taban || p.taban.length < 3) continue;
  const sekil = new THREE.Shape();
  sekil.moveTo(p.taban[0][0], -p.taban[0][1]);
  for (let i = 1; i < p.taban.length; i++) sekil.lineTo(p.taban[i][0], -p.taban[i][1]);
  sekil.closePath();
  const g = new THREE.ShapeGeometry(sekil);
  g.rotateX(-Math.PI / 2);
  const renk = p.tip === 'garden' ? 0x6fae5f : p.tip === 'grass' ? 0x63994f : 0x557f3b;
  const mesh = new THREE.Mesh(g, zeminMalzeme(renk, -1));
  mesh.position.y = 0.05;
  mesh.renderOrder = 1;
  katman.park.add(mesh);
}

// ===== YOLLAR (genişlikli şeritler, tek mesh + vertex rengi) ==================
{
  const poz = [], renkdizi = [];
  const renk = new THREE.Color();
  const YOL_RENKLERI = { ana: 0x3d3d44, service: 0x8f8f8f, footway: 0xd8d4c6, path: 0xd8d4c6, pedestrian: 0xcac4b2 };
  const Y = 0.07;
  function seritEkle(duz, genislik, tip) {
    if (!duz || duz.length < 4) return;
    const pts = [];
    for (let i = 0; i < duz.length; i += 2) pts.push([duz[i], duz[i + 1]]);
    const w = (genislik || 1.4) / 2;
    renk.setHex(YOL_RENKLERI[tip] ?? 0xd8d4c6);
    // Miter birleşim: her düğümde gelen+giden yönün açıortayından kenar
    // noktaları hesaplanır → keskin dönüşlerde köşe boşluğu kalmaz.
    const sol = [], sag = [];
    let oncekiNx = 0, oncekiNz = 1;
    for (let i = 0; i < pts.length; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[Math.min(pts.length - 1, i + 1)];
      let dx = p2[0] - p0[0], dz = p2[1] - p0[1];
      let L = Math.hypot(dx, dz);
      if (L < 1e-6) { dx = oncekiNx; dz = oncekiNz; L = 1; }  // U-dönüşü koruması
      dx /= L; dz /= L; oncekiNx = dx; oncekiNz = dz;
      let miter = 1;
      if (i > 0 && i < pts.length - 1) {
        const ax = p1[0] - p0[0], az = p1[1] - p0[1];
        const bx = p2[0] - p1[0], bz = p2[1] - p1[1];
        const dot = (ax * bx + az * bz) / ((Math.hypot(ax, az) || 1) * (Math.hypot(bx, bz) || 1));
        miter = Math.min(1 / Math.max(0.5, Math.sqrt((1 + dot) / 2)), 2.5);
      }
      sol.push([p1[0] + (-dz) * w * miter, p1[1] + dx * w * miter]);
      sag.push([p1[0] - (-dz) * w * miter, p1[1] - dx * w * miter]);
    }
    for (let i = 0; i < pts.length - 1; i++) {
      // sol[i], sol[i+1], sag[i] / sag[i], sol[i+1], sag[i+1] — normal +Y,
      // yoksa FrontSide malzemeyle üstten bakınca elenir (görünmez yol hatası)
      poz.push(sol[i][0], Y, sol[i][1], sol[i + 1][0], Y, sol[i + 1][1], sag[i][0], Y, sag[i][1],
               sag[i][0], Y, sag[i][1], sol[i + 1][0], Y, sol[i + 1][1], sag[i + 1][0], Y, sag[i + 1][1]);
      for (let k = 0; k < 6; k++) renkdizi.push(renk.r, renk.g, renk.b);
    }
  }
  for (const [duz, genislik, tip] of YOL_L) seritEkle(duz, genislik, tip);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(poz, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(renkdizi, 3));
  g.computeVertexNormals();
  const yolMesh = new THREE.Mesh(g, zeminMalzeme(0xffffff, -3, true));
  yolMesh.renderOrder = 3;
  katman.yol.add(yolMesh);
}

// ===== FISKIYELER (kare veya daire havuz + sütun) ============================
for (const f of FISK_L) {
  const [fx, fz] = f.merkez;
  if (f.sekil === 'kare') {
    // Kare havuz: taş bordür + su yüzeyi + ortada küçük sütun
    const kenar = f.boyut || 8;
    const bordur = new THREE.Mesh(
      new THREE.BoxGeometry(kenar, 0.6, kenar),
      new THREE.MeshLambertMaterial({ color: 0xcfc9bd })
    );
    bordur.position.set(fx, 0.3, fz);
    katman.fiskiiye.add(bordur);
    const su = new THREE.Mesh(
      new THREE.PlaneGeometry(kenar - 1, kenar - 1),
      zeminMalzeme(0x3f93c5, -4)
    );
    su.rotation.x = -Math.PI / 2;
    su.position.set(fx, 0.62, fz);
    su.renderOrder = 4;
    katman.fiskiiye.add(su);
    const sutun = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 2.2, 1.2),
      new THREE.MeshLambertMaterial({ color: 0xd9d9d9 })
    );
    sutun.position.set(fx, 1.1, fz);
    katman.fiskiiye.add(sutun);
    continue;
  }
  const havuz = new THREE.Mesh(
    new THREE.CircleGeometry(f.yaricap, 24),
    zeminMalzeme(0x3f93c5, -4)
  );
  havuz.rotation.x = -Math.PI / 2;
  havuz.position.set(fx, 0.08, fz);
  havuz.renderOrder = 4;
  katman.fiskiiye.add(havuz);
  const sutun = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.6, f.yaricap * 0.6, 10),
    new THREE.MeshLambertMaterial({ color: 0xd9d9d9 })
  );
  sutun.position.set(fx, (f.yaricap * 0.6) / 2 + 0.08, fz);
  katman.fiskiiye.add(sutun);
}

// ===== SPOR ALANLARI (futbol sahası yeşil, koşu pisti kırmızı) ================
for (const a of SPOR_L) {
  if (!a.taban || a.taban.length < 3) continue;
  const sekil = new THREE.Shape();
  sekil.moveTo(a.taban[0][0], -a.taban[0][1]);
  for (let i = 1; i < a.taban.length; i++) sekil.lineTo(a.taban[i][0], -a.taban[i][1]);
  sekil.closePath();
  const g = new THREE.ShapeGeometry(sekil);
  g.rotateX(-Math.PI / 2);
  const spor = (a.spor || '').toLowerCase();
  const renk = spor.includes('run') || spor.includes('track') ? 0x9e5b4a
    : spor.includes('tennis') ? 0x5b8fa8
    : spor.includes('basket') || spor.includes('volley') ? 0x8a7f5b : 0x4f9e4f;
  const mesh = new THREE.Mesh(g, zeminMalzeme(renk, -2));
  mesh.position.y = 0.06;
  mesh.renderOrder = 2;
  katman.spor.add(mesh);
}

// ===== BİNALAR ================================================================
// taban poligonu (x,z) + yükseklik -> yere dikilmiş extrude geometri
function binaGeometrisi(taban, yukseklik) {
  const sekil = new THREE.Shape();
  sekil.moveTo(taban[0][0], -taban[0][1]);          // (x, -z): rotateX sonrası doğru eksene gelir
  for (let i = 1; i < taban.length; i++) sekil.lineTo(taban[i][0], -taban[i][1]);
  sekil.closePath();
  const g = new THREE.ExtrudeGeometry(sekil, { depth: yukseklik, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  return g;
}
function merkezHesapla(taban) {
  let sx = 0, sz = 0;
  for (const p of taban) { sx += p[0]; sz += p[1]; }
  return [sx / taban.length, sz / taban.length];
}
function etiketSprite(metin) {
  const tuval = document.createElement('canvas');
  const ctx = tuval.getContext('2d');
  const fontPx = 30;
  ctx.font = `${fontPx}px system-ui, sans-serif`;
  const genislik = Math.ceil(ctx.measureText(metin).width) + 16;
  tuval.width = genislik; tuval.height = fontPx + 16;
  const c2 = tuval.getContext('2d');
  c2.fillStyle = 'rgba(10,14,20,0.72)';
  c2.fillRect(0, 0, tuval.width, tuval.height);
  c2.font = `${fontPx}px system-ui, sans-serif`;
  c2.fillStyle = '#ffd479';
  c2.fillText(metin, 8, fontPx + 4);
  const doku = new THREE.CanvasTexture(tuval);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: doku, depthTest: false }));
  sprite.scale.set(tuval.width * 0.10, tuval.height * 0.10, 1);
  return sprite;
}

// Arka plan: tek geometride birleştir (performans)
{
  const geometrisiler = [];
  for (const [duz, yukseklik] of ARKA_L) {
    const taban = [];
    for (let i = 0; i < duz.length; i += 2) taban.push([duz[i], duz[i + 1]]);
    if (taban.length >= 3) geometrisiler.push(binaGeometrisi(taban, yukseklik));
  }
  const birlesik = mergeGeometries(geometrisiler, false);
  const mesh = new THREE.Mesh(birlesik, new THREE.MeshLambertMaterial({ color: 0x99a1a6 }));
  katman.arka.add(mesh);
}

// Önemli binalar: ayrı malzeme (yan cephe + çatı) + etiket
const onemliListesi = [];
for (const b of ONEMLI_L) {
  if (!b.taban || b.taban.length < 3) continue;
  const geometri = binaGeometrisi(b.taban, b.yukseklik);
  const yanMat = new THREE.MeshLambertMaterial({ color: b.renk ?? 0xcdbfa3 });
  const catMat = new THREE.MeshLambertMaterial({ color: b.catRengi ?? 0x6e6e6e });
  // ExtrudeGeometry grupları: 0 = yan duvar, 1 = kapak (çatı)
  const mesh = new THREE.Mesh(geometri, [yanMat, catMat]);
  katman.bina.add(mesh);
  const [cx, cz] = merkezHesapla(b.taban);
  const etiket = etiketSprite(b.isim);
  etiket.position.set(cx, b.yukseklik + 5, cz);
  katman.etiket.add(etiket);
  onemliListesi.push({ isim: b.isim, merkez: [cx, cz], yukseklik: b.yukseklik });
}

// ===== EJDERHA MODELİ (burun -Z'ye dönük; grup adı uçuş koduyla aynı) ========
const ucak = new THREE.Group();
const govdeGrubu = new THREE.Group();   // süzülme/sallanma animasyonu için iç grup
ucak.add(govdeGrubu);
const kanatSagPivot = new THREE.Group();
const kanatSolPivot = new THREE.Group();
let kuyruk2 = null, kuyruk3 = null;
{
  const deriMat = new THREE.MeshLambertMaterial({ color: 0x2e7d46 });
  const karinMat = new THREE.MeshLambertMaterial({ color: 0xd8c98a });
  const zarMat = new THREE.MeshLambertMaterial({ color: 0x46b15c, side: THREE.DoubleSide });
  const boynuzMat = new THREE.MeshLambertMaterial({ color: 0xe8e0c8 });

  // gövde + karın
  const govde = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 12), deriMat);
  govde.scale.set(1, 0.9, 2.2);
  govdeGrubu.add(govde);
  const karin = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 10), karinMat);
  karin.scale.set(0.85, 0.7, 1.9);
  karin.position.set(0, -0.18, -0.1);
  govdeGrubu.add(karin);

  // boyun + kafa (ileride, yukarıda)
  const boyun = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 1.0, 10), deriMat);
  boyun.position.set(0, 0.45, -1.15);
  boyun.rotation.x = 0.5;
  govdeGrubu.add(boyun);
  const kafa = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 12), deriMat);
  kafa.position.set(0, 0.75, -1.7);
  kafa.scale.set(1, 0.9, 1.15);
  govdeGrubu.add(kafa);
  const burun = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.6, 10), deriMat);
  burun.position.set(0, 0.68, -2.25);
  burun.rotation.x = -Math.PI / 2;
  govdeGrubu.add(burun);
  // boynuzlar (geriye yatık) + gözler
  for (const s of [-1, 1]) {
    const boynuz = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.55, 8), boynuzMat);
    boynuz.position.set(s * 0.22, 1.05, -1.45);
    boynuz.rotation.x = 0.7;
    govdeGrubu.add(boynuz);
    const goz = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd94d }));
    goz.position.set(s * 0.24, 0.85, -1.95);
    govdeGrubu.add(goz);
  }

  // kuyruk: 3 boğum, uçlara doğru incelir (sallanma için pivotlu)
  const kuyruk1 = new THREE.Group();
  kuyruk1.position.set(0, 0.05, 1.1);
  govdeGrubu.add(kuyruk1);
  const bogum1 = new THREE.Mesh(new THREE.ConeGeometry(0.34, 1.1, 10), deriMat);
  bogum1.rotation.x = Math.PI / 2;
  bogum1.position.z = 0.55;
  kuyruk1.add(bogum1);
  kuyruk2 = new THREE.Group();
  kuyruk2.position.z = 1.05;
  kuyruk1.add(kuyruk2);
  const bogum2 = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1.0, 10), deriMat);
  bogum2.rotation.x = Math.PI / 2;
  bogum2.position.z = 0.5;
  kuyruk2.add(bogum2);
  kuyruk3 = new THREE.Group();
  kuyruk3.position.z = 0.95;
  kuyruk2.add(kuyruk3);
  const bogum3 = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.9, 8), deriMat);
  bogum3.rotation.x = Math.PI / 2;
  bogum3.position.z = 0.45;
  kuyruk3.add(bogum3);
  const diken = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.35, 8), boynuzMat);
  diken.position.z = 0.95;
  diken.rotation.x = Math.PI / 2;
  kuyruk3.add(diken);

  // bacaklar (4 kısa silindir)
  for (const [sx, sz] of [[-1, -0.5], [1, -0.5], [-1, 0.7], [1, 0.7]]) {
    const bacak = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.55, 8), deriMat);
    bacak.position.set(sx * 0.42, -0.5, sz);
    bacak.rotation.z = sx * 0.35;
    govdeGrubu.add(bacak);
  }

  // kanat zarı (yarasa kanadı formu, +X'e uzanır; solu aynalanır)
  function kanatZari() {
    const s = new THREE.Shape();
    s.moveTo(0, 0.1);
    s.lineTo(2.6, 0.35);
    s.lineTo(1.7, -0.55);
    s.lineTo(0.9, -0.35);
    s.lineTo(0, -0.7);
    s.closePath();
    return new THREE.ShapeGeometry(s);
  }
  kanatSagPivot.position.set(0.35, 0.35, -0.2);
  kanatSagPivot.add(new THREE.Mesh(kanatZari(), zarMat));
  govdeGrubu.add(kanatSagPivot);
  kanatSolPivot.position.set(-0.35, 0.35, -0.2);
  const solZar = new THREE.Mesh(kanatZari(), zarMat);
  solZar.scale.x = -1;
  kanatSolPivot.add(solZar);
  govdeGrubu.add(kanatSolPivot);
}
sahne.add(ucak);
ucak.rotation.order = 'YXZ';
let ejderhaT = 0;   // kanat çırpma/sallanma saati

// ===== UÇUŞ DURUMU ============================================================
let konum = new THREE.Vector3(15, 40, 639);   // başlangıç: Teknoloji Fakültesi üstü
let yaw = 0;   // kuzeye (kampüs merkezine) bakış
let kameraModu = 'takip';                  // 'takip' | 'kokpit'

// sensör ham + yumuşatılmış değerler
const ham = { pitch: 0, roll: 0, buton: 1 };
const yumusak = { pitch: 0, roll: 0 };
const ofset = { pitch: 0, roll: 0 };
const sanal = { pitch: 0, roll: 0 };       // klavye simülasyonu değeri
let klavyeModu = false;
// --- GEZİN MODU (uçaktan bağımsız serbest kamera) ---
let gezinModu = false;
const gezin = { yaw: 0, pitch: -15, hiz: 25, konum: new THREE.Vector3(0, 40, 0) };
const GEZIN_HIZ_ADIMI = 5, GEZIN_MIN_HIZ = 1, GEZIN_MAX_HIZ = 300;

// ===== VERİ KAYNAKLARI ========================================================
// --BUTON-KENAR-BASLA-- (test/geometri test.mjs bu bloğu okuyup çalıştırır; imzayı bozma)
let butonKararli = 1, butonArdarda = 0, sonToggleMs = -1e9;
function butonKenarIsle(hamButon, msSimdi) {
  // Donanım sönümlemesi: 3 ardışık aynı örnek (~60ms @50Hz) gerekli,
  // ardından 500ms refractory (çift-toggle engelle). true = geçerli basış.
  if (hamButon === butonKararli) { butonArdarda = 0; return false; }
  butonArdarda++;
  if (butonArdarda < 3) return false;
  const dustu = (butonKararli === 1 && hamButon === 0);
  butonKararli = hamButon; butonArdarda = 0;
  if (dustu && msSimdi - sonToggleMs > 500) { sonToggleMs = msSimdi; return true; }
  return false;
}
// --BUTON-KENAR-BIT--
function satirIsle(satir) {
  const p = satir.split(',');
  if (p.length < 3) return;
  const pitch = parseFloat(p[0]);
  const roll = parseFloat(p[1]);
  const buton = parseInt(p[2]);
  if (isNaN(pitch) || isNaN(roll) || isNaN(buton)) return;
  // buton 1 -> 0 düşen kenar (sönümlü): kamera değiştir
  if (butonKenarIsle(buton, performance.now())) kameraTogglesi();
  ham.buton = buton;
  ham.pitch = pitch * YURUT_PITCH;
  ham.roll = roll * YURUT_ROLL;
}

let aktifKaynak = null;         // 'seri' | 'ws'
let kesici = null;              // bağlantıyı kapatma fonksiyonu

const d0 = document.getElementById('durum');
function durumGuncelle(ek) {
  const kn = kameraModu === 'takip' ? 'TAKİP (3. şahıs)' : 'KOKPİT (1. şahıs)';
  const knAdi = aktifKaynak ? (aktifKaynak === 'seri' ? 'Seri Port' : 'WebSocket') : '—';
  d0.innerHTML =
    `<b>Kaynak:</b> ${knAdi} | <b>Pitch:</b> ${ham.pitch.toFixed(1)}° | ` +
    `<b>Roll:</b> ${ham.roll.toFixed(1)}° | <b>İrtifa:</b> ${konum.y.toFixed(0)} m | ` +
    `<b>Hız:</b> ${HIZ_MS} m/s | <b>Kamera:</b> ${kn}` + (ek ? ` | ${ek}` : '');
}

// --- Web Serial (Chrome/Edge) ---
async function seriBaglan() {
  if (!('serial' in navigator)) {
    alert('Bu tarayıcı Web Serial API desteklemiyor. Chrome/Edge kullanın veya WebSocket köprüsünü deneyin.');
    return;
  }
  await kes();
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    aktifKaynak = 'seri';
    const decoder = new TextDecoderStream();
    const okumaBitti = port.readable.pipeTo(decoder.writable).catch(() => {});
    const okuyucu = decoder.readable.getReader();
    kesici = () => {
      okuyucu.cancel();
      okumaBitti.then(() => port.close()).catch(() => {});
    };
    let tampon = '';
    while (true) {
      const { value, done } = await okuyucu.read();
      if (done) break;
      tampon += value;
      let k;
      while ((k = tampon.indexOf('\n')) >= 0) {
        const satir = tampon.slice(0, k).trim();
        tampon = tampon.slice(k + 1);
        if (satir) satirIsle(satir);
      }
    }
    aktifKaynak = null;
  } catch (e) {
    console.warn('Seri bağlantı hatası:', e);
    aktifKaynak = null;
  }
}

// --- WebSocket (Firefox/Safari, seri_kopru.py ile) ---
function wsBaglan() {
  kesSenk();
  try {
    const ws = new WebSocket('ws://localhost:8765');
    ws.onopen = () => { aktifKaynak = 'ws'; };
    ws.onclose = () => { if (aktifKaynak === 'ws') aktifKaynak = null; };
    ws.onmessage = (ol) => {
      for (const satir of ol.data.split('\n')) if (satir.trim()) satirIsle(satir.trim());
    };
    ws.onerror = () => alert('WebSocket bağlantısı kurulamadı.\nTerminalde "python3 seri_kopru.py" çalıştırıyor musunuz?');
    kesici = () => ws.close();
  } catch (e) { console.warn(e); }
}

function kesSenk() {
  if (kesici) { try { kesici(); } catch {} kesici = null; }
  aktifKaynak = null;
  ham.buton = 1; butonKararli = 1; butonArdarda = 0;
}
async function kes() { kesSenk(); }

// ===== HUD BUTONLARI ==========================================================
document.getElementById('btnSeri').onclick = seriBaglan;
document.getElementById('btnWs').onclick = wsBaglan;
document.getElementById('btnKes').onclick = kes;
document.getElementById('btnSifirla').onclick = sifirla;
document.getElementById('btnDuzenle').onclick = duzenleYakala;
document.getElementById('btnGezin').onclick = () => gezinToggle();
document.getElementById('chkKlavye').onchange = (e) => { klavyeModu = e.target.checked; };

function gezinToggle() {
  gezinModu = !gezinModu;
  if (gezinModu) {
    gezin.konum = konum.clone().add(new THREE.Vector3(0, 20, 0));
    gezin.yaw = yaw;
    gezin.pitch = -20;
  }
}

function sifirla() {
  if (klavyeModu) { sanal.pitch = 0; sanal.roll = 0; }
  ofset.pitch = yumusak.pitch;
  ofset.roll = yumusak.roll;
}

// ===== KLAVYE SİMÜLASYONU + KISAYOLLAR ========================================
const tuslar = {};
addEventListener('keydown', (e) => {
  tuslar[e.key] = true;
  // Tek-seferlik tuşlarda basılı-tutma tekrarını yoksay (çift-toggle engelle);
  // ok tuşları/WASD bilinçli olarak tekrar alır (sürekli hareket için tuslar[] kullanılır).
  if (e.repeat) return;
  if (e.key === 'c' || e.key === 'C') sifirla();
  if (e.key === 'e' || e.key === 'E') duzenleYakala();
  if (e.key === 'g' || e.key === 'G') gezinToggle();
  if (e.key === '+' || e.key === '=') gezin.hiz = Math.min(gezin.hiz ? GEZIN_MAX_HIZ : GEZIN_MAX_HIZ, gezin.hiz + GEZIN_HIZ_ADIMI);
  if (e.key === '-' || e.key === '_') gezin.hiz = Math.max(GEZIN_MIN_HIZ, gezin.hiz - GEZIN_HIZ_ADIMI);
  if (e.key === 'Enter') kameraTogglesi();
});
addEventListener('keyup', (e) => { tuslar[e.key] = false; });

function kameraTogglesi() {
  kameraModu = (kameraModu === 'takip') ? 'kokpit' : 'takip';
}

// ===== DÜZENLEME MODU =========================================================
const duzenlePanel = document.getElementById('duzenle');
const duzenleMetin = document.getElementById('duzenleMetin');
function duzenleYakala() {
  duzenlePanel.style.display = 'flex';
  // uçağa en yakın önemli binayı bul (60 m içinde)
  let enYakin = null, enYakinD = 60;
  for (const b of onemliListesi) {
    const dx = b.merkez[0] - konum.x, dz = b.merkez[1] - konum.z;
    const d = Math.hypot(dx, dz);
    if (d < enYakinD) { enYakinD = d; enYakin = b; }
  }
  let cikti;
  if (enYakin) {
    cikti = `// En yakın önemli bina (uçaktan ${enYakinD.toFixed(0)} m):\n` +
      `{ isim: ${JSON.stringify(enYakin.isim)}, merkez: [${enYakin.merkez[0].toFixed(1)}, ${enYakin.merkez[1].toFixed(1)}], ` +
      `yukseklik: ${enYakin.yukseklik} }  // konum: uçağın altı x=${konum.x.toFixed(1)}, z=${konum.z.toFixed(1)}`;
  } else {
    const x = konum.x.toFixed(1), z = konum.z.toFixed(1), y = konum.y.toFixed(1);
    cikti = `// Yakında önemli bina yok. Yeni bina şablonu (uçak konumu: x=${x}, z=${z}, irtifa=${y}):
  {
    isim: "YENI BINA",
    taban: [[${(konum.x - 10).toFixed(1)}, ${(konum.z - 8).toFixed(1)}], [${(konum.x + 10).toFixed(1)}, ${(konum.z - 8).toFixed(1)}],
            [${(konum.x + 10).toFixed(1)}, ${(konum.z + 8).toFixed(1)}], [${(konum.x - 10).toFixed(1)}, ${(konum.z + 8).toFixed(1)}]],
    yukseklik: ${Math.max(6, konum.y | 0)},
    renk: 0xcdbfa3,
    catRengi: 0x6e6e6e,
    detay: { katsayisi: 3 }
  },`;
  }
  duzenleMetin.value = cikti;
  console.log(cikti);
}

// ===== OYNATIM DÖNGÜSÜ ========================================================
const saat = new THREE.Clock();
function dongu() {
  requestAnimationFrame(dongu);
  const dt = Math.min(saat.getDelta(), 0.05);

  // --- EJDERHA ANİMASYONU: çok ufak kanat çırpma + süzülme/sallanma ---
  ejderhaT += dt;
  const cirp = Math.sin(ejderhaT * 7) * 0.12;
  kanatSagPivot.rotation.z = 0.10 + cirp;
  kanatSolPivot.rotation.z = -0.10 - cirp;
  govdeGrubu.position.y = Math.sin(ejderhaT * 7) * 0.06;
  govdeGrubu.rotation.z = Math.sin(ejderhaT * 2.2) * 0.03;
  kuyruk2.rotation.y = Math.sin(ejderhaT * 2.2 - 0.8) * 0.10;
  kuyruk3.rotation.y = Math.sin(ejderhaT * 2.2 - 1.6) * 0.12;

  // --- GEZİN MODU: serbest kamera (uçaktan bağımsız) ---
  if (gezinModu) {
    const adimRot = 60 * dt;  // kamera dönüş hızı (°/s)
    if (tuslar['ArrowUp']) gezin.pitch = Math.min(80, gezin.pitch + adimRot);
    if (tuslar['ArrowDown']) gezin.pitch = Math.max(-80, gezin.pitch - adimRot);
    if (tuslar['ArrowLeft']) gezin.yaw += THREE.MathUtils.degToRad(adimRot);
    if (tuslar['ArrowRight']) gezin.yaw -= THREE.MathUtils.degToRad(adimRot);

    const cosP = Math.cos(THREE.MathUtils.degToRad(gezin.pitch));
    const dir = new THREE.Vector3(-Math.sin(gezin.yaw) * cosP,
                                  Math.sin(THREE.MathUtils.degToRad(gezin.pitch)),
                                  -Math.cos(gezin.yaw) * cosP);
    const ileriYatay = new THREE.Vector3(-Math.sin(gezin.yaw), 0, -Math.cos(gezin.yaw));
    const sag = new THREE.Vector3(Math.cos(gezin.yaw), 0, -Math.sin(gezin.yaw));

    if (tuslar['w'] || tuslar['W']) gezin.konum.addScaledVector(ileriYatay, gezin.hiz * dt);
    if (tuslar['s'] || tuslar['S']) gezin.konum.addScaledVector(ileriYatay, -gezin.hiz * dt);
    if (tuslar['a'] || tuslar['A']) gezin.konum.addScaledVector(sag, -gezin.hiz * dt);
    if (tuslar['d'] || tuslar['D']) gezin.konum.addScaledVector(sag, gezin.hiz * dt);
    if (tuslar['q'] || tuslar['Q']) gezin.konum.y += gezin.hiz * dt;
    if (tuslar['z'] || tuslar['Z']) gezin.konum.y = Math.max(1, gezin.konum.y - gezin.hiz * dt);

    kamera.position.copy(gezin.konum);
    kamera.lookAt(gezin.konum.clone().addScaledVector(dir, 10));
    durumGuncelle(`Gezin (WASD ileri/geri/sağ sol, Q/Z irtifa, +/- hız=${gezin.hiz} m/s, G/Çıkış)`);
    renderer.render(sahne, kamera);
    return;
  }

  // klavye simülasyonu: sanal sensör değerlerini güncelle (DÜZELTİLMİŞ yönler)
  const adim = 60 * dt;   // °/s
  if (tuslar['ArrowUp']) sanal.pitch = Math.min(45, sanal.pitch + adim);
  if (tuslar['ArrowDown']) sanal.pitch = Math.max(-45, sanal.pitch - adim);
  if (tuslar['ArrowLeft']) sanal.roll = Math.max(-45, sanal.roll - adim);   // sol ← (düzeltildi)
  if (tuslar['ArrowRight']) sanal.roll = Math.min(45, sanal.roll + adim);  // sağ → (düzeltildi)

  // kaynak seçimi: klavye modu açıksa sanal değer, değilse ham sensör
  const hedefPitch = klavyeModu ? sanal.pitch : ham.pitch;
  const hedefRoll = klavyeModu ? sanal.roll : ham.roll;

  // EMA yumuşatma
  yumusak.pitch += (hedefPitch - yumusak.pitch) * EMA_ALFA;
  yumusak.roll += (hedefRoll - yumusak.roll) * EMA_ALFA;

  // kalibrasyon offseti + ölü bant
  let pitchEtkili = yumusak.pitch - ofset.pitch;
  let rollEtkili = yumusak.roll - ofset.roll;
  if (Math.abs(pitchEtkili) < DEADBAND_DERECE) pitchEtkili = 0;
  if (Math.abs(rollEtkili) < DEADBAND_DERECE) rollEtkili = 0;

  // --- uçuş dinamiği ---
  yaw -= THREE.MathUtils.degToRad(rollEtkili) * DONUS_KAZANCI * dt;
  const dikeyHiz = pitchEtkili * TIRMANIS_KAZANCI;
  const ileri = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  konum.addScaledVector(ileri, HIZ_MS * dt);
  konum.y = Math.max(0.8, konum.y + dikeyHiz * dt);
  // kampüs sınırı
  const yatay = Math.hypot(konum.x, konum.z);
  if (yatay > SINIR_YARICAP) {
    konum.x *= SINIR_YARICAP / yatay;
    konum.z *= SINIR_YARICAP / yatay;
  }

  // uçağı yerleştir + görsel olarak eğ
  ucak.position.copy(konum);
  ucak.rotation.y = yaw;
  ucak.rotation.x = THREE.MathUtils.degToRad(pitchEtkili);
  ucak.rotation.z = -THREE.MathUtils.degToRad(rollEtkili);

  // --- kameralar ---
  if (kameraModu === 'takip') {
    const arka = ileri.clone().multiplyScalar(-9).add(new THREE.Vector3(0, 3.2, 0));
    const ideal = konum.clone().add(arka);
    kamera.position.lerp(ideal, 0.08);
    kamera.lookAt(konum.x, konum.y + 1, konum.z);
  } else {
    const burun = konum.clone().addScaledVector(ileri, 2.2);
    burun.y += 0.9;
    kamera.position.copy(burun);
    const bakis = konum.clone().addScaledVector(ileri, 60);
    kamera.lookAt(bakis);
  }

  durumGuncelle();
  renderer.render(sahne, kamera);
}
dongu();

addEventListener('resize', () => {
  kamera.aspect = innerWidth / innerHeight;
  kamera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
