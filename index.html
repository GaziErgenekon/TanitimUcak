<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// binalar.js / cevre.js eksik/eski sürümse boş liste kullan (çökme engelle)
const ONEMLI_L = (typeof ONEMLI_BINALAR === 'undefined') ? [] : ONEMLI_BINALAR;
const ARKA_L = (typeof ARKA_PLAN_BINALAR === 'undefined') ? [] : ARKA_PLAN_BINALAR;
const PARK_L = (typeof PARKLAR === 'undefined') ? [] : PARKLAR;
const YOL_L = (typeof YOLLAR === 'undefined') ? [] : YOLLAR;
const FISK_L = (typeof FISKIYELER === 'undefined') ? [] : FISKIYELER;
const SPOR_L = (typeof SPOR_ALANLARI === 'undefined') ? [] : SPOR_ALANLARI;
const AGAC_L = (typeof AGACLAR === 'undefined') ? [] : AGACLAR;
const ISLETME_L = (typeof ISLETMELER === 'undefined') ? [] : ISLETMELER;
const OTOPARK_L = (typeof OTOPARKLAR === 'undefined') ? [] : OTOPARKLAR;
const DURAK_L = (typeof DURAKLAR === 'undefined') ? [] : DURAKLAR;
const RAY_L = (typeof RAYLAR === 'undefined') ? [] : RAYLAR;
const GIRIS_L = (typeof GIRISLER === 'undefined') ? [] : GIRISLER;
const BAYRAK_L = (typeof BAYRAKLAR === 'undefined') ? [] : BAYRAKLAR;
const CARPISMA_YOK_L = (typeof CARPISMA_YOK === 'undefined') ? [] : CARPISMA_YOK;

// ===== AYARLAR ================================================================
const HIZ_MS          = 25;      // uçağın sabit ileri hızı (m/s)
const DONUS_KAZANCI   = 1.1;     // roll(°) başına dönüş hızı (°/s)
const TIRMANIS_KAZANCI= 0.55;    // pitch(°) başına dikey hız (m/s)
const EMA_ALFA        = 0.15;    // sensör yumuşatma (0-1, küçük = daha yumuşak)
const DEADBAND_DERECE = 2;       // ±ölü bant
const SINIR_YARICAP   = 1300;    // uçuş sınırı (kampüs merkezinden, m)
const YURUT_PITCH     = 1;       // -1 yaparsan pitch terslenir (sensör yönüne göre)
const YURUT_ROLL      = 1;       // -1 yaparsan roll terslenir

// ===== SAHNE ==================================================================
const kapsayici = document.getElementById('sahne');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
kapsayici.appendChild(renderer.domElement);

const sahne = new THREE.Scene();
const GOKYUZU = 0x87b7d8;
sahne.background = new THREE.Color(GOKYUZU);
sahne.fog = new THREE.Fog(GOKYUZU, 500, 2400);

const kamera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);
sahne.add(new THREE.AmbientLight(0xffffff, 0.7));
const gunes = new THREE.DirectionalLight(0xfff4e0, 1.6);
gunes.position.set(400, 700, 300);
sahne.add(gunes);

// Zemin + grid
const zemin = new THREE.Mesh(
  new THREE.CircleGeometry(2800, 64),
  new THREE.MeshLambertMaterial({ color: 0x4a7c43 })
);
zemin.rotation.x = -Math.PI / 2;
sahne.add(zemin);
const grid = new THREE.GridHelper(2800, 56, 0xffffff, 0x689b5e);
grid.material.opacity = 0.25; grid.material.transparent = true;
sahne.add(grid);

// ===== KATMAN GRUPLARI (sağ alttaki panelden aç/kapa) ==========================
const katman = {};
for (const ad of ['bina', 'etiket', 'arka', 'yol', 'park', 'spor', 'fiskiye',
                  'agac', 'poi', 'otopark', 'ray', 'giris']) {
  katman[ad] = new THREE.Group();
  sahne.add(katman[ad]);
}
document.querySelectorAll('#ayarlar input[data-katman]').forEach((kutucuk) => {
  kutucuk.onchange = () => { katman[kutucuk.dataset.katman].visible = kutucuk.checked; };
});

// Düz zemin katmanları için titreme önleyici malzeme: polygonOffset +
// renderOrder + depthWrite:false → çakışan zeminler derinlik kavgasına
// girmez, üst üste binme sırası sabitlenir (veri aynen korunur).
function zeminMalzeme(renk, faktor, vertexRenk = false) {
  return new THREE.MeshLambertMaterial({
    color: renk, vertexColors: vertexRenk, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: faktor, polygonOffsetUnits: faktor,
  });
}

// ===== PARKLAR (düz poligonlar, yere koyulur) ================================
for (const p of PARK_L) {
  if (!p.taban || p.taban.length < 3) continue;
  const sekil = new THREE.Shape();
  sekil.moveTo(p.taban[0][0], -p.taban[0][1]);
  for (let i = 1; i < p.taban.length; i++) sekil.lineTo(p.taban[i][0], -p.taban[i][1]);
  sekil.closePath();
  const g = new THREE.ShapeGeometry(sekil);
  g.rotateX(-Math.PI / 2);
  const renk = p.tip === 'garden' ? 0x6fae5f : p.tip === 'grass' ? 0x63994f : 0x557f3b;
  const mesh = new THREE.Mesh(g, zeminMalzeme(renk, -1));
  mesh.position.y = 0.05;
  mesh.renderOrder = 1;
  katman.park.add(mesh);
}

// ===== YOLLAR (genişlikli şeritler, tek mesh + vertex rengi) ==================
// Miter birleşim: her düğümde gelen+giden yönün açıortayından kenar noktaları
// hesaplanır → keskin dönüşlerde köşe boşluğu kalmaz. Yol ve raylar ortak kullanır.
function seritDoldur(poz, renkdizi, duz, genislik, renkHex, Y) {
  if (!duz || duz.length < 4) return;
  const pts = [];
  for (let i = 0; i < duz.length; i += 2) pts.push([duz[i], duz[i + 1]]);
  const w = (genislik || 1.4) / 2;
  const renk = new THREE.Color(renkHex);
  const sol = [], sag = [];
  let oncekiNx = 0, oncekiNz = 1;
  for (let i = 0; i < pts.length; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[Math.min(pts.length - 1, i + 1)];
    let dx = p2[0] - p0[0], dz = p2[1] - p0[1];
    let L = Math.hypot(dx, dz);
    if (L < 1e-6) { dx = oncekiNx; dz = oncekiNz; L = 1; }  // U-dönüşü koruması
    dx /= L; dz /= L; oncekiNx = dx; oncekiNz = dz;
    let miter = 1;
    if (i > 0 && i < pts.length - 1) {
      const ax = p1[0] - p0[0], az = p1[1] - p0[1];
      const bx = p2[0] - p1[0], bz = p2[1] - p1[1];
      const dot = (ax * bx + az * bz) / ((Math.hypot(ax, az) || 1) * (Math.hypot(bx, bz) || 1));
      miter = Math.min(1 / Math.max(0.5, Math.sqrt((1 + dot) / 2)), 2.5);
    }
    sol.push([p1[0] + (-dz) * w * miter, p1[1] + dx * w * miter]);
    sag.push([p1[0] - (-dz) * w * miter, p1[1] - dx * w * miter]);
  }
  for (let i = 0; i < pts.length - 1; i++) {
    // sol[i], sol[i+1], sag[i] / sag[i], sol[i+1], sag[i+1] — normal +Y,
    // yoksa FrontSide malzemeyle üstten bakınca elenir (görünmez yol hatası)
    poz.push(sol[i][0], Y, sol[i][1], sol[i + 1][0], Y, sol[i + 1][1], sag[i][0], Y, sag[i][1],
             sag[i][0], Y, sag[i][1], sol[i + 1][0], Y, sol[i + 1][1], sag[i + 1][0], Y, sag[i + 1][1]);
    for (let k = 0; k < 6; k++) renkdizi.push(renk.r, renk.g, renk.b);
  }
}

// ===== YOLLAR (genişlikli şeritler, tek mesh + vertex rengi) ==================
{
  const poz = [], renkdizi = [];
  const YOL_RENKLERI = {
    ana: 0x3d3d44, service: 0x8f8f8f, footway: 0xd8d4c6, path: 0xd8d4c6,
    pedestrian: 0xcac4b2, tertiary: 0x4a4a52, unclassified: 0x55555c,
    living: 0x6b6b70, primary: 0x35353c, motorway: 0x3a3a40,
    steps: 0xc9c2b2, cycleway: 0x8a4b4b, track: 0x8b7d63,
  };
  for (const [duz, genislik, tip] of YOL_L) {
    seritDoldur(poz, renkdizi, duz, genislik, YOL_RENKLERI[tip] ?? 0xd8d4c6, 0.07);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(poz, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(renkdizi, 3));
  g.computeVertexNormals();
  const yolMesh = new THREE.Mesh(g, zeminMalzeme(0xffffff, -3, true));
  yolMesh.renderOrder = 3;
  katman.yol.add(yolMesh);
}

// ===== RAYLI SİSTEM (koyu şerit + açık travers dokusu) ========================
{
  const poz = [], renkdizi = [];
  for (const [duz, tip] of RAY_L) {
    const renk = tip === 'tram' ? 0x6a5a4a : 0x4a4038;
    seritDoldur(poz, renkdizi, duz, tip === 'tram' ? 2.4 : 3.2, renk, 0.075);
  }
  if (poz.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(poz, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(renkdizi, 3));
    g.computeVertexNormals();
    const rayMesh = new THREE.Mesh(g, zeminMalzeme(0xffffff, -3, true));
    rayMesh.renderOrder = 3;
    katman.ray.add(rayMesh);
  }
}

// ===== OTOPARKLAR (koyu zemin) ================================================
for (const duz of OTOPARK_L) {
  if (!duz || duz.length < 6) continue;
  const sekil = new THREE.Shape();
  sekil.moveTo(duz[0], -duz[1]);
  for (let i = 2; i < duz.length; i += 2) sekil.lineTo(duz[i], -duz[i + 1]);
  sekil.closePath();
  const g = new THREE.ShapeGeometry(sekil);
  g.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(g, zeminMalzeme(0x4d4d52, -2));
  mesh.position.y = 0.04;
  mesh.renderOrder = 2;
  katman.otopark.add(mesh);
}

// ===== AĞAÇLAR (InstancedMesh: 1 gövde + 3 yaprak = 4 çizim) ==================
{
  if (AGAC_L.length) {
    const govdeG = new THREE.CylinderGeometry(0.16, 0.24, 1, 5);
    const yaprakG = [
      new THREE.IcosahedronGeometry(1, 0),   // geniş yapraklı (0)
      new THREE.ConeGeometry(1, 2.1, 7),     // iğne yapraklı (1)
      new THREE.SphereGeometry(1, 6, 5),     // çalı (2)
    ];
    const govdeMat = new THREE.MeshLambertMaterial({ color: 0x6b4b32 });
    const yaprakMat = [
      new THREE.MeshLambertMaterial({ color: 0x3f7a35 }),
      new THREE.MeshLambertMaterial({ color: 0x2f5f3a }),
      new THREE.MeshLambertMaterial({ color: 0x557f3b }),
    ];
    const tipSayi = [0, 0, 0];
    for (const a of AGAC_L) tipSayi[Math.min(2, Math.abs(a[2] | 0))]++;
    const govde = new THREE.InstancedMesh(govdeG, govdeMat, AGAC_L.length);
    const yapraklar = yaprakG.map((g, t) =>
      new THREE.InstancedMesh(g, yaprakMat[t], tipSayi[t]));
    const mat = new THREE.Matrix4(), quat = new THREE.Quaternion();
    const kon = new THREE.Vector3(), olc = new THREE.Vector3();
    const renk = new THREE.Color();
    const sayac = [0, 0, 0];
    for (let i = 0; i < AGAC_L.length; i++) {
      const [x, z, tipHam] = AGAC_L[i];
      const tip = Math.min(2, Math.abs(tipHam | 0));
      // deterministik boyut/renk: koordinat hash'i (Math.sin hızlı ve yeterli)
      const r1 = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
      const r2 = Math.abs(Math.sin(x * 39.346 + z * 11.135) * 24634.6345) % 1;
      const h = 1.5 + r1 * 1.6 + tip * 0.3;                      // gövde boyu
      olc.set(0.8 + r2 * 0.5, h, 0.8 + r2 * 0.5);
      kon.set(x, h / 2, z);
      govde.setMatrixAt(i, mat.compose(kon, quat, olc));
      const r = 1.0 + r2 * 1.0 + (tip === 1 ? 0.5 : 0);
      olc.set(r, r * (tip === 1 ? 1.7 : 1.15), r);
      kon.set(x, h + r * (tip === 1 ? 0.6 : 0.45), z);
      yapraklar[tip].setMatrixAt(sayac[tip], mat.compose(kon, quat, olc));
      renk.setHSL(0.28 + (r1 - 0.5) * 0.06, 0.38 + r2 * 0.18, 0.28 + r1 * 0.12);
      yapraklar[tip].setColorAt(sayac[tip], renk);
      sayac[tip]++;
    }
    govde.instanceMatrix.needsUpdate = true;
    govde.frustumCulled = false;
    katman.agac.add(govde);
    for (const y of yapraklar) {
      y.instanceMatrix.needsUpdate = true;
      y.frustumCulled = false;
      if (y.instanceColor) y.instanceColor.needsUpdate = true;
      katman.agac.add(y);
    }
  }
}

// ===== İŞLETMELER / DURAKLAR (billboard ikon + isim) ==========================
const poiSpriteListesi = [];
function poiSprite(tip, isim) {
  const tuval = document.createElement('canvas');
  const ctx = tuval.getContext('2d');
  const baslik = (isim || '').trim();

function panoDokusu(metin) {

// Türk bayrağı dokusu (ay-yıldız yaklaşık)
function turkBayragiDokusu() {
  const G = 384, Y = 256;
  const tuval = document.createElement('canvas');
  tuval.width = G; tuval.height = Y;
  const c = tuval.getContext('2d');
  c.fillStyle = '#e30a17';
  c.fillRect(0, 0, G, Y);
  const cx = G * 0.37, cy = Y / 2, r = Y * 0.30;
  c.fillStyle = '#ffffff';
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#e30a17';
  c.beginPath(); c.arc(cx + r * 0.42, cy, r * 0.80, 0, Math.PI * 2); c.fill();
  const sx = cx + r * 0.95, sy = cy, sr = r * 0.45;
  c.fillStyle = '#ffffff';
  c.beginPath();
  for (let i = 0; i < 5; i++) {
    const a1 = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
    const a2 = a1 + Math.PI / 5;
    const x1 = sx + Math.cos(a1) * sr, y1 = sy + Math.sin(a1) * sr;
    const x2 = sx + Math.cos(a2) * sr * 0.42, y2 = sy + Math.sin(a2) * sr * 0.42;
    if (i === 0) c.moveTo(x1, y1); else c.lineTo(x1, y1);
    c.lineTo(x2, y2);
  }
  c.closePath(); c.fill();
  const doku = new THREE.CanvasTexture(tuval);
  doku.anisotropy = 4;
  return doku;
}

// --GEO-BASLA-- (test/ayikla.mjs okur; imzayı bozma)
// taban poligonu (x,z) + yükseklik -> yere dikilmiş extrude geometri
function binaGeometrisi(taban, yukseklik) {
  const sekil = new THREE.Shape();
  sekil.moveTo(taban[0][0], -taban[0][1]);          // (x, -z): rotateX sonrası doğru eksene gelir
  for (let i = 1; i < taban.length; i++) sekil.lineTo(taban[i][0], -taban[i][1]);
  sekil.closePath();
  const g = new THREE.ExtrudeGeometry(sekil, { depth: yukseklik, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  return g;
}
function merkezHesapla(taban) {
  let sx = 0, sz = 0;
  for (const p of taban) { sx += p[0]; sz += p[1]; }
  return [sx / taban.length, sz / taban.length];
}
// ExtrudeGeometry yan duvar UV'leri (x, 1-depth) gelir: dikey eksen TERS ve
// metre değil. Duvar üçgenlerini (materyal grubu 1) dünya koordinatıyla
// yeniden yaz: u = baskın yatay eksen (m), v = dünya yüksekliği (m).
// Böylece doku repeat'i metre cinsinden çalışır ve kat hizası tutar.
function duvarUVGuncelle(geometri) {
  const grup = geometri.groups.find(g => g.materialIndex === 1);
  if (!grup) return;
  const pos = geometri.attributes.position;
  const nor = geometri.attributes.normal;
  const uv = geometri.attributes.uv;
  for (let i = grup.start; i < grup.start + grup.count; i++) {
    const u = Math.abs(nor.getX(i)) >= Math.abs(nor.getZ(i))
      ? pos.getZ(i) : pos.getX(i);
    uv.setXY(i, u, pos.getY(i));
  }
  uv.needsUpdate = true;
}

// --PENCERE-AYAR-BASLA-- (test/geometri test.mjs bu bloğu okuyup çalıştırır; imzayı bozma)
function pencereSinirla(v, alt, ust, varsayilan) {
  const x = Number(v);
  if (!Number.isFinite(x)) return varsayilan;
  return Math.min(ust, Math.max(alt, x));
}
function pencereAyar(b) {
  const p = (b && b.pencere !== undefined && b.pencere !== null) ? b.pencere : {};
  if (p === false || p.acik === false) return null;   // bu binada pencere yok
  const katAralik = pencereSinirla(
    p.katAralik,
    2, 8,
    (b && b.yukseklik && b.detay && b.detay.katsayisi)
      ? b.yukseklik / b.detay.katsayisi : 3);          // kat hizası: yükseklik/kat
  const kolonAralik = pencereSinirla(p.kolonAralik, 0.8, 12, 1.6);  // yatay pencere sıklığı
  return {
    kolonAralik,                                      // yatay pencere merkezleri arası (m)
    katAralik,                                        // dikey kat aralığı (m)
    genislik: pencereSinirla(p.genislik, 0.4, kolonAralik - 0.15,
                             Math.min(kolonAralik * 0.62, 1.1)),
    yukseklik: pencereSinirla(p.yukseklik, 0.4, katAralik - 0.6,
                              Math.min(katAralik * 0.5, 1.5)),
    zeminBos: Math.round(pencereSinirla(p.zeminBos, 0, 4, 0)),  // alttaki penceresiz kat
    yogunluk: pencereSinirla(p.yogunluk, 0, 1, 0.85), // pencerelerin ne kadarı çizilir
    renk: p.renk ?? 0x7fb6cc,                         // cam rengi
    isikOran: pencereSinirla(p.isikOran, 0, 1, 0.25), // yanan (sarı) cam oranı
  };
}
// --PENCERE-AYAR-BIT--
// --PENCERE-DOKU-BASLA-- (test/ayikla.mjs okur; imzayı bozma)
function mulberry32(tohum) {
  let a = tohum >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Parametrik pencere dokusu. İki kip:
//   tam bina: tuval tam yükseklik; her kat ayrı çizilir (zemin hizası birebir).
//   karo     : tuval tek kat; tekrar (repeat) ile tüm yüksekliğe döşenir (arka plan).
// Zemin beyaz tutulur ki duvar rengi (material.color) ile çarpılınca cephe rengi korunsun.
function pencereDokusu(ayar, tohum, yukseklikM, karoModu = false) {
  const HEDEF_PXM = 24, MAXPX = 2048;
  const yuk = Math.max(ayar.katAralik, Number(yukseklikM) || ayar.katAralik);
  const pxm = karoModu
    ? HEDEF_PXM
    : Math.max(10, Math.min(HEDEF_PXM, Math.floor(MAXPX / yuk)));
  const S = Math.max(8, Math.round(ayar.kolonAralik * pxm));
  const H = Math.round((karoModu ? ayar.katAralik : yuk) * pxm);
  const rnd = mulberry32(tohum);
  const tuval = document.createElement('canvas');
  tuval.width = S; tuval.height = H;
  const c = tuval.getContext('2d');
  c.fillStyle = '#f4f4f4';
  c.fillRect(0, 0, S, H);
  const camRengi = '#' + new THREE.Color(ayar.renk).getHexString();
  const kGen = Math.max(2, ayar.genislik * pxm);
  const kYuk = Math.max(2, ayar.yukseklik * pxm);
  const katSayisi = karoModu ? 1 : Math.max(1, Math.floor(yuk / ayar.katAralik));
  const cx = S / 2;
  for (let kat = 0; kat < katSayisi; kat++) {
    if (!karoModu && kat < ayar.zeminBos) continue;   // zemin kat(lar) penceresiz
    // v=0 zemin: tuvalin ALT sırası (CanvasTexture flipY). Kat merkezi:
    const cy = H - ((karoModu ? 0 : kat * ayar.katAralik) + ayar.katAralik / 2) * pxm;
    if (rnd() >= ayar.yogunluk) continue;              // bu pencere boş (duvar)
    const yaniyor = rnd() < ayar.isikOran;
    const yari = [kGen / 2, kYuk / 2];
    // çerçeve gölgesi + cam + parlama + orta kayıt
    c.fillStyle = 'rgba(0,0,0,0.28)';
    c.fillRect(cx - yari[0] - 1, cy - yari[1] - 1, kGen + 2, kYuk + 2);
    c.fillStyle = yaniyor ? '#ffd27a' : camRengi;
    c.fillRect(cx - yari[0], cy - yari[1], kGen, kYuk);
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.fillRect(cx - yari[0], cy - yari[1], kGen, kYuk * 0.25);
    c.fillStyle = '#f4f4f4';
    c.fillRect(cx - 1, cy - yari[1], 2, kYuk);
    c.fillRect(cx - yari[0], cy - 1, kGen, 2);
  }
  const doku = new THREE.CanvasTexture(tuval);
  doku.wrapS = doku.wrapT = THREE.RepeatWrapping;
  doku.anisotropy = 4;
  // extrude UV'leri metre biriminde → karo boyutu metre cinsinden ölçeklenir
  doku.repeat.set(1 / ayar.kolonAralik, karoModu ? 1 / ayar.katAralik : 1 / yuk);
  return doku;
}
// --PENCERE-DOKU-BIT--

// Arka plan: duvarlar ve çatılar AYRI mesh'lerde birleştirilir.
// Neden ayrı? mergeGeometries grupları düşürür; malzeme dizisi [yan, çatı]
// grupsuz geometride HİÇ çizilmez (render listesine girmez). Tek malzemeli
// iki mesh'te bu sorun yoktur. Çatıya pencere düşmez.
// --DILIMLE-BASLA-- (test/geometri test.mjs bu bloğu okuyup çalıştırır; imzayı bozma)
function dilimle(geometri, malzemeNo) {
  // ExtrudeGeometry (non-indexed, ardışık aralık): grup 0 = kapak (üst/alt),
  // grup 1 = yan duvar. (three.js WorldUVGenerator sırası.)
  const grup = geometri.groups.find(g => g.materialIndex === malzemeNo);
  const cikti = new THREE.BufferGeometry();
  for (const ad of ['position', 'normal', 'uv']) {
    const kaynak = geometri.attributes[ad];
    const bas = grup.start * kaynak.itemSize, son = (grup.start + grup.count) * kaynak.itemSize;
    cikti.setAttribute(ad, new THREE.BufferAttribute(kaynak.array.slice(bas, son), kaynak.itemSize));
  }
  return cikti;
}

// Arka plan: 4 pencere varyantı → 4 malzeme kovası (her kova tek merge mesh).
// UV'ler metre olduğundan ortak karo dokusu tekrarıyla kat hizası her binada tutar.
// arkaKur(haric): tek binayı dışarıda bırakarak yeniden kurar (düzenleme modu).
const ARKA_RENKLERI = [0x99a1a6, 0xa6adb1, 0x8f979c, 0xa0a6ab];
const ARKA_VARYANT = 4;
const arkaAyar = pencereAyar(null);
let arkaMeshler = [], arkaCatMesh = null;
function arkaKur(haric = -1) {
  for (const m of arkaMeshler) {
    katman.arka.remove(m);
    m.geometry.dispose();
    if (m.material.map) m.material.map.dispose();
    m.material.dispose();
  }
  arkaMeshler = [];
  if (arkaCatMesh) {
    katman.arka.remove(arkaCatMesh);
    arkaCatMesh.geometry.dispose();
    arkaCatMesh.material.dispose();
    arkaCatMesh = null;
  }
  const duvarlar = Array.from({ length: ARKA_VARYANT }, () => []);
  const araliklar = Array.from({ length: ARKA_VARYANT }, () => []);
  const basSayac = new Array(ARKA_VARYANT).fill(0);
  const catilar = [], catAraliklar = [];
  let catBas = 0;
  const ucgen = (g) => g.attributes.position.count / 3;
  for (let i = 0; i < ARKA_L.length; i++) {
    if (i === haric) continue;
    const [duz, yukseklik] = ARKA_L[i];
    const taban = [];
    for (let k = 0; k < duz.length; k += 2) taban.push([duz[k], duz[k + 1]]);
    if (taban.length < 3) continue;
    const g = binaGeometrisi(taban, yukseklik);
    duvarUVGuncelle(g);
    const gd = dilimle(g, 1), gc = dilimle(g, 0);   // 1 = duvar, 0 = kapak
    g.dispose();
    const v = Math.abs(Math.round(duz[0] * 7 + duz[1] * 13)) % ARKA_VARYANT;
    araliklar[v].push({ bas: basSayac[v], adet: ucgen(gd), idx: i });
    basSayac[v] += ucgen(gd);
    duvarlar[v].push(gd);
    catAraliklar.push({ bas: catBas, adet: ucgen(gc), idx: i });
    catBas += ucgen(gc);
    catilar.push(gc);
  }
  for (let v = 0; v < ARKA_VARYANT; v++) {
    if (!duvarlar[v].length) continue;
    const mesh = new THREE.Mesh(
      mergeGeometries(duvarlar[v], false),
      new THREE.MeshLambertMaterial({
        color: ARKA_RENKLERI[v],
        map: pencereDokusu(arkaAyar, 101 + v * 37, arkaAyar.katAralik, true),
      }));
    mesh.userData.tip = 'arka';
    mesh.userData.araliklar = araliklar[v];
    mesh.userData.renk = ARKA_RENKLERI[v];
    mesh.userData.varyant = v;
    katman.arka.add(mesh);
    arkaMeshler.push(mesh);
  }
  if (catilar.length) {
    arkaCatMesh = new THREE.Mesh(
      mergeGeometries(catilar, false),
      new THREE.MeshLambertMaterial({ color: 0x7e858a }));
    arkaCatMesh.userData.tip = 'arka';
    arkaCatMesh.userData.araliklar = catAraliklar;
    katman.arka.add(arkaCatMesh);
  }
}
arkaKur();

// Bir mesh'te faceIndex'i bina aralığına çevir (arka plan seçimi için)
function arkaIdxBul(mesh, faceIndex) {
  const araliklar = mesh.userData.araliklar;
  if (!araliklar) return -1;
  let alt = 0, ust = araliklar.length - 1;
  while (alt <= ust) {
    const orta = (alt + ust) >> 1;
    const a = araliklar[orta];
    if (faceIndex < a.bas) ust = orta - 1;
    else if (faceIndex >= a.bas + a.adet) alt = orta + 1;
    else return a.idx;
  }
  return -1;
}

// Önemli binalar: ayrı malzeme (yan cephe + çatı) + etiket
// Düzenleme modu bu kayıtları kullanır: entry.bina / entry.mesh / entry.etiket.
const onemliListesi = [];
function onemliMeshYap(b) {
  const geometri = binaGeometrisi(b.taban, b.yukseklik);
  duvarUVGuncelle(geometri);
  const pAyar = pencereAyar(b);
  const yanMat = new THREE.MeshLambertMaterial({
    color: b.renk ?? 0xcdbfa3,
    ...(pAyar ? { map: pencereDokusu(pAyar, (b.isim || '?').length * 131 + 17, b.yukseklik) } : {}),
  });
  const catMat = new THREE.MeshLambertMaterial({ color: b.catRengi ?? 0x6e6e6e });
  // ExtrudeGeometry grupları: 0 = kapak (çatı), 1 = yan duvar
  const mesh = new THREE.Mesh(geometri, [catMat, yanMat]);
  mesh.userData.tip = 'onemli';
  mesh.userData.bina = b;
  return mesh;
}
function onemliEkle(b, etiketli = true) {
  const entry = { bina: b, mesh: null, etiket: null };
  entry.mesh = onemliMeshYap(b);
  katman.bina.add(entry.mesh);
  if (etiketli) {
    const [cx, cz] = merkezHesapla(b.taban);
    entry.etiket = etiketSprite(b.isim);
    entry.etiket.position.set(cx, b.yukseklik + 5, cz);
    katman.etiket.add(entry.etiket);
  }
  onemliListesi.push(entry);
  return entry;
}
function onemliMeshGuncelle(entry) {
  const yeni = onemliMeshYap(entry.bina);
  entry.mesh.geometry.dispose();
  for (const m of entry.mesh.material) { if (m.map) m.map.dispose(); m.dispose(); }
  katman.bina.remove(entry.mesh);
  entry.mesh = yeni;
  katman.bina.add(yeni);
  if (entry.etiket) {
    const [cx, cz] = merkezHesapla(entry.bina.taban);
    katman.etiket.remove(entry.etiket);
    entry.etiket.material.map?.dispose();
    entry.etiket.material.dispose();
    entry.etiket = etiketSprite(entry.bina.isim);
    entry.etiket.position.set(cx, entry.bina.yukseklik + 5, cz);
    katman.etiket.add(entry.etiket);
  }
}
for (const b of ONEMLI_L) {
  if (!b.taban || b.taban.length < 3) continue;
  onemliEkle(b);
}

// --CARPISMA-BASLA-- (test/ayikla.mjs okur; imzayı bozma)
// Nokta poligon içinde mi (ışın atma yöntemi)
function polIcinde(x, z, pol) {
  let ic = false;
  for (let i = 0; i < pol.length; i++) {
    const x1 = pol[i][0], z1 = pol[i][1];
    const x2 = pol[(i + 1) % pol.length][0], z2 = pol[(i + 1) % pol.length][1];
    if ((z1 > z) !== (z2 > z) && x < ((x2 - x1) * (z - z1)) / (z2 - z1) + x1) ic = !ic;
  }
  return ic;
}
// Noktanın poligon kenarına en kısa mesafesi (m)
function polKenarMesafe(x, z, pol) {
  let en = Infinity;
  for (let i = 0; i < pol.length; i++) {
    const x1 = pol[i][0], z1 = pol[i][1];
    const x2 = pol[(i + 1) % pol.length][0], z2 = pol[(i + 1) % pol.length][1];
    const dx = x2 - x1, dz = z2 - z1;
    const L2 = dx * dx + dz * dz;
    const t = L2 === 0 ? 0 : Math.max(0, Math.min(1, ((x - x1) * dx + (z - z1) * dz) / L2));
    const d = Math.hypot(x - (x1 + t * dx), z - (z1 + t * dz));
    if (d < en) en = d;
  }
  return en;
}
// Bina + ağaç listelerinde çarpışma var mı? kapali=true kayıtlar yok sayılır.
function carpismaTesti(binalar, agaclar, x, z, y, r) {
  for (const b of binalar) {
    if (b.kapali || y > b.yukseklik + 0.6) continue;
    if (x < b.bbox[0] - r || x > b.bbox[1] + r ||
        z < b.bbox[2] - r || z > b.bbox[3] + r) continue;
    if (polIcinde(x, z, b.pol) || polKenarMesafe(x, z, b.pol) < r) return true;
  }
  for (const a of agaclar) {
    if (y > a.yukseklik) continue;
    const dx = x - a.x, dz = z - a.z;
    const menzil = a.yaricap + r;
    if (dx * dx + dz * dz < menzil * menzil) return true;
  }
  return false;
}

// ===== ÇARPIŞMA IZGARASI (32 m hücre; bina poligonları + ağaç silindirleri) ==
const CARPISMA_HUCRE = 32;
const CARPISMA_YOK_SET = new Set(CARPISMA_YOK_L);
const arkaDonusen = new Set();          // Edit 2.0 ile bireyselleştirilen arka plan indeksleri
let carpismaGrid = new Map();
let carpismaBinalar = [], carpismaGenel = [], carpismaAgaclar = [];
let carpismaAcik = true;                // Ayarlar > Çarpışma
let agacCarpisma = true;                // Ayarlar > Ağaçlara çarpma
let sonCarpismaMs = -1e9;
function carpismaEkle(kayit) {
  carpismaBinalar.push(kayit);
  const [x1, x2, z1, z2] = kayit.bbox;
  const c0x = Math.floor(x1 / CARPISMA_HUCRE), c1x = Math.floor(x2 / CARPISMA_HUCRE);
  const c0z = Math.floor(z1 / CARPISMA_HUCRE), c1z = Math.floor(z2 / CARPISMA_HUCRE);
  if ((c1x - c0x + 1) * (c1z - c0z + 1) > 64) {   // çok büyük bina: her sorguda bak
    kayit.genel = true;
    carpismaGenel.push(kayit);
    return;
  }
  for (let cx = c0x; cx <= c1x; cx++) {
    for (let cz = c0z; cz <= c1z; cz++) {
      const k = cx + ':' + cz;
      let liste = carpismaGrid.get(k);
      if (!liste) { liste = []; carpismaGrid.set(k, liste); }
      liste.push(kayit);
    }
  }
}
function carpismaKutular(x, z, r) {
  const liste = [];
  const c0x = Math.floor((x - r) / CARPISMA_HUCRE), c1x = Math.floor((x + r) / CARPISMA_HUCRE);
  const c0z = Math.floor((z - r) / CARPISMA_HUCRE), c1z = Math.floor((z + r) / CARPISMA_HUCRE);
  for (let cx = c0x; cx <= c1x; cx++) {
    for (let cz = c0z; cz <= c1z; cz++) {
      const l = carpismaGrid.get(cx + ':' + cz);
      if (l) for (const k of l) liste.push(k);
    }
  }
  return liste;
}
function carpismaKur() {
  carpismaGrid = new Map();
  carpismaBinalar = [];
  carpismaGenel = [];
  const ekle = (pol, yuk, kapali) => {
    if (!pol || pol.length < 3) return;
    const xs = pol.map(p => p[0]), zs = pol.map(p => p[1]);
    carpismaEkle({ pol, yukseklik: yuk, kapali,
                   bbox: [Math.min(...xs), Math.max(...xs), Math.min(...zs), Math.max(...zs)] });
  };
  for (const kayit of onemliListesi) {
    const b = kayit.bina;
    ekle(b.taban, b.yukseklik, b.carpisma === false);
  }
  for (let i = 0; i < ARKA_L.length; i++) {
    if (arkaDonusen.has(i)) continue;    // bireysel mesh olarak onemliListesi'nde
    const [duz, yuk, oid] = ARKA_L[i];
    if (CARPISMA_YOK_SET.has(oid)) continue;
    const pol = [];
    for (let k = 0; k < duz.length; k += 2) pol.push([duz[k], duz[k + 1]]);
    ekle(pol, yuk, false);
  }
  // Ağaç silindirleri: render'daki deterministik boyut formülünün aynısı
  carpismaAgaclar = AGAC_L.map(([x, z, tipHam]) => {
    const tip = Math.min(2, Math.abs(tipHam | 0));
    const r1 = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
    const r2 = Math.abs(Math.sin(x * 39.346 + z * 11.135) * 24634.6345) % 1;
    const h = 1.5 + r1 * 1.6 + tip * 0.3;
    const r = 1.0 + r2 * 1.0 + (tip === 1 ? 0.5 : 0);
    return { x, z, yukseklik: h + r * 0.7, yaricap: Math.max(0.5, r * 0.75) };
  });
}
carpismaKur();
function carpismaVar(x, z, y, r) {
  if (!carpismaAcik) return false;
  const adaylar = carpismaKutular(x, z, r);
  for (const g of carpismaGenel) adaylar.push(g);
  return carpismaTesti(adaylar, agacCarpisma ? carpismaAgaclar : [], x, z, y, r);
}

// --BUTON-KENAR-BASLA-- (test/geometri test.mjs bu bloğu okuyup çalıştırır; imzayı bozma)
let butonKararli = 1, butonArdarda = 0, sonToggleMs = -1e9;
function butonKenarIsle(hamButon, msSimdi) {
  // Donanım sönümlemesi: 3 ardışık aynı örnek (~60ms @50Hz) gerekli,
  // ardından 500ms refractory (çift-toggle engelle). true = geçerli basış.
  if (hamButon === butonKararli) { butonArdarda = 0; return false; }
  butonArdarda++;
  if (butonArdarda < 3) return false;
  const dustu = (butonKararli === 1 && hamButon === 0);
  butonKararli = hamButon; butonArdarda = 0;
  if (dustu && msSimdi - sonToggleMs > 500) { sonToggleMs = msSimdi; return true; }
  return false;
}
// --BUTON-KENAR-BIT--
// --PIL-BASLA-- (test/ayikla.mjs okur; imzayı bozma)
const pil = { mv: -1 };   // firmware 4. alan; -1/eksik = ölçüm kapalı
function pilYuzde(v) {
  if (v >= 4.15) return 100;
  if (v <= 3.3) return 0;
  if (v >= 3.9) return Math.round(75 + ((v - 3.9) / 0.25) * 25);
  if (v >= 3.7) return Math.round(40 + ((v - 3.7) / 0.2) * 35);
  return Math.round(((v - 3.3) / 0.4) * 40);
}
function pilMetni() {
  if (pil.mv <= 0) return '—';
  const v = pil.mv / 1000;
  return `%${pilYuzde(v)} (${v.toFixed(2)}V)`;
}
// --PIL-BIT--
// --SATIR-ISLE-BASLA-- (test/ayikla.mjs okur; imzayı bozma)
function satirIsle(satir) {
  const p = satir.split(',');
  if (p.length < 3) return;
  const pitch = parseFloat(p[0]);
  const roll = parseFloat(p[1]);
  const buton = parseInt(p[2]);
  if (isNaN(pitch) || isNaN(roll) || isNaN(buton)) return;
  veriKaydet(satir);
  // buton 1 -> 0 düşen kenar (sönümlü): kamera değiştir
  if (butonKenarIsle(buton, performance.now())) kameraTogglesi();
  ham.buton = buton;
  ham.pitch = pitch * YURUT_PITCH;
  ham.roll = roll * YURUT_ROLL;
  const pilMv = p.length >= 4 ? parseInt(p[3]) : NaN;
  pil.mv = (isNaN(pilMv) || pilMv <= 0) ? -1 : pilMv;
}

// --- Web Serial (Chrome/Edge) ---
async function seriBaglan() {
  if (!('serial' in navigator)) {
    alert('Bu tarayıcı Web Serial API desteklemiyor. Chrome/Edge kullanın veya WebSocket köprüsünü deneyin.');
    return;
  }
  await kes();
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    kaynakAyarla('seri');
    const decoder = new TextDecoderStream();
    const okumaBitti = port.readable.pipeTo(decoder.writable).catch(() => {});
    const okuyucu = decoder.readable.getReader();
    kesici = () => {
      okuyucu.cancel();
      okumaBitti.then(() => port.close()).catch(() => {});
    };
    let tampon = '';
    while (true) {
      const { value, done } = await okuyucu.read();
      if (done) break;
      tampon += value;
      let k;
      while ((k = tampon.indexOf('\n')) >= 0) {
        const satir = tampon.slice(0, k).trim();
        tampon = tampon.slice(k + 1);
        if (satir) satirIsle(satir);
      }
    }
    kaynakAyarla(null);
  } catch (e) {
    console.warn('Seri bağlantı hatası:', e);
    kaynakAyarla(null);
  }
}

// --- WebSocket (Firefox/Safari, seri_kopru.py ile) ---
// sessiz=true: açılıştaki otomatik denemede hata penceresi gösterme
function wsBaglan(sessiz = false) {
  kesSenk();
  try {
    const ws = new WebSocket('ws://localhost:8765');
    ws.onopen = () => { kaynakAyarla('ws'); };
    ws.onclose = () => { if (aktifKaynak === 'ws') kaynakAyarla(null); };
    ws.onmessage = (ol) => {
      for (const satir of ol.data.split('\n')) if (satir.trim()) satirIsle(satir.trim());
    };
    ws.onerror = () => {
      if (!sessiz) alert('WebSocket bağlantısı kurulamadı.\nTerminalde "python3 seri_kopru.py" çalıştırıyor musunuz?');
    };
    kesici = () => ws.close();
  } catch (e) { console.warn(e); }
}

// --- Bluetooth LE (Web Bluetooth; Chrome/Edge. Firefox için bt_kopru.py) ---
// Firmware Nordic UART Servis (NUS) yayınlar; TX karakteristiği notify eder.
const NUS_SERVIS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let btTampon = '';   // BLE bildirimi satırı bölebilir → tamponla
function btParcaIsle(parca) {
  btTampon += parca;
  let k;
  while ((k = btTampon.indexOf('\n')) >= 0) {
    const satir = btTampon.slice(0, k).trim();
    btTampon = btTampon.slice(k + 1);
    if (satir) satirIsle(satir);
  }
}
async function btBaglan() {
  if (!navigator.bluetooth) {
    alert('Bu tarayıcı Web Bluetooth desteklemiyor. Chrome/Edge kullanın ' +
          'veya bt_kopru.py ile WebSocket köprüsünü deneyin.');
    return;
  }
  await kes();
  try {
    const cihaz = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS_SERVIS] }],
      optionalServices: [NUS_SERVIS],
    });
    const sunucu = await cihaz.gatt.connect();
    const servis = await sunucu.getPrimaryService(NUS_SERVIS);
    const karakter = await servis.getCharacteristic(NUS_TX);
    const veriGeldi = (e) => btParcaIsle(new TextDecoder().decode(e.target.value));
    karakter.addEventListener('characteristicvaluechanged', veriGeldi);
    await karakter.startNotifications();
    cihaz.addEventListener('gattserverdisconnected', () => {
      if (aktifKaynak === 'bt') kaynakAyarla(null);
    });
    kaynakAyarla('bt');
    kesici = () => {
      try { karakter.removeEventListener('characteristicvaluechanged', veriGeldi); } catch {}
      try { karakter.stopNotifications(); } catch {}
      try { cihaz.gatt.disconnect(); } catch {}
      btTampon = '';
    };
  } catch (e) {
    if (e && e.name !== 'NotFoundError') {
      console.warn('Bluetooth bağlantı hatası:', e);
      alert('Bluetooth bağlantısı kurulamadı: ' + (e.message || e));
    }
    kaynakAyarla(null);
  }
}

function kesSenk() {
  if (kesici) { try { kesici(); } catch {} kesici = null; }
  kaynakAyarla(null);
  oranPencere = [];
  ham.buton = 1; butonKararli = 1; butonArdarda = 0;
  pil.mv = -1;
}
async function kes() { kesSenk(); }

const ray = new THREE.Raycaster();

function fareGuncelle(e) {
  const r = renderer.domElement.getBoundingClientRect();
  fare.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  fare.y = -((e.clientY - r.top) / r.height) * 2 + 1;

function yerNoktasi(e) {

function binaSec(hit) {
  const obj = hit.object;
  if (obj.userData.tip === 'onemli') {
    const entry = onemliListesi.find(x => x.mesh === obj);
    if (entry) secimAyarla(entry, !!entry.arkaKaynak);
    return;
  }
  if (obj.userData.tip === 'arka') {
    const idx = arkaIdxBul(obj, hit.faceIndex);
    if (idx < 0) return;
    const [duz, yuk, osmWay] = ARKA_L[idx];
    const taban = [];
    for (let i = 0; i < duz.length; i += 2) taban.push([duz[i], duz[i + 1]]);
    const renk = obj.userData.renk ?? ARKA_RENKLERI[0];
    arkaDonusen.add(idx);   // çarpışma ızgarasında kovadan sayılmasın
    arkaKur(idx);           // bu binayı kovadan çıkar (bireysel mesh olarak eklenecek)
    const entry = onemliEkle({
      isim: 'Bina' + (osmWay ? ' ' + osmWay : ''), taban, yukseklik: yuk,
      kat: Math.max(1, Math.round(yuk / 6)), renk, osmWay,
    });
    entry.arkaKaynak = true;
    entry.duzenlendi = true;
    carpismaKur();
    secimAyarla(entry, true);
  }
}
function geometriGuncelle() {
  if (!secim.entry) return;
  const yeniG = binaGeometrisi(secim.entry.bina.taban, secim.entry.bina.yukseklik);
  carpismaKur();
  secim.entry.mesh.geometry.dispose();

  panelDoldur();

  fareGuncelle(e);
  ray.setFromCamera(fare, kamera);
  const h = ray.intersectObjects(handleGrubu.children, false)[0];
  if (h) {
    surukle = h.object.userData.kose;
    secim.kose = surukle;
    renderer.domElement.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  const hedefler = [...katman.bina.children, ...katman.arka.children];
  const hit = ray.intersectObjects(hedefler, true)[0];
  if (hit) binaSec(hit);
  else secimTemizle();

// ===== OYNATIM DÖNGÜSÜ ========================================================
const saat = new THREE.Clock();
function dongu() {
  requestAnimationFrame(dongu);
  const dt = Math.min(saat.getDelta(), 0.05);

  // --- EJDERHA ANİMASYONU: çok ufak kanat çırpma + süzülme/sallanma ---
  ejderhaT += dt;
  const cirp = Math.sin(ejderhaT * 7) * 0.12;
  kanatSagPivot.rotation.z = 0.10 + cirp;
  kanatSolPivot.rotation.z = -0.10 - cirp;
  govdeGrubu.position.y = Math.sin(ejderhaT * 7) * 0.06;
  govdeGrubu.rotation.z = Math.sin(ejderhaT * 2.2) * 0.03;
  kuyruk2.rotation.y = Math.sin(ejderhaT * 2.2 - 0.8) * 0.10;
  kuyruk3.rotation.y = Math.sin(ejderhaT * 2.2 - 1.6) * 0.12;
  bayrakGuncelle(ejderhaT);

  // --- GEZİN MODU: serbest kamera (uçaktan bağımsız) ---
  if (gezinModu) {
    const adimRot = 60 * dt;  // kamera dönüş hızı (°/s)
    if (tuslar['ArrowUp']) gezin.pitch = Math.min(80, gezin.pitch + adimRot);
    if (tuslar['ArrowDown']) gezin.pitch = Math.max(-80, gezin.pitch - adimRot);
    if (tuslar['ArrowLeft']) gezin.yaw += THREE.MathUtils.degToRad(adimRot);
    if (tuslar['ArrowRight']) gezin.yaw -= THREE.MathUtils.degToRad(adimRot);

    const cosP = Math.cos(THREE.MathUtils.degToRad(gezin.pitch));
    const dir = new THREE.Vector3(-Math.sin(gezin.yaw) * cosP,
                                  Math.sin(THREE.MathUtils.degToRad(gezin.pitch)),
                                  -Math.cos(gezin.yaw) * cosP);
    const ileriYatay = new THREE.Vector3(-Math.sin(gezin.yaw), 0, -Math.cos(gezin.yaw));
    const sag = new THREE.Vector3(Math.cos(gezin.yaw), 0, -Math.sin(gezin.yaw));

    if (tuslar['w'] || tuslar['W']) gezin.konum.addScaledVector(ileriYatay, gezin.hiz * dt);
    if (tuslar['s'] || tuslar['S']) gezin.konum.addScaledVector(ileriYatay, -gezin.hiz * dt);
    if (tuslar['a'] || tuslar['A']) gezin.konum.addScaledVector(sag, -gezin.hiz * dt);
    if (tuslar['d'] || tuslar['D']) gezin.konum.addScaledVector(sag, gezin.hiz * dt);
    if (tuslar['q'] || tuslar['Q']) gezin.konum.y += gezin.hiz * dt;
    if (tuslar['z'] || tuslar['Z']) gezin.konum.y = Math.max(1, gezin.konum.y - gezin.hiz * dt);

    kamera.position.copy(gezin.konum);
    kamera.lookAt(gezin.konum.clone().addScaledVector(dir, 10));
    poiGuncelle();
    durumGuncelle(`Gezin (WASD ileri/geri/sağ sol, Q/Z irtifa, +/- hız=${gezin.hiz} m/s, G/Çıkış)`);
    renderer.render(sahne, kamera);
    return;
  }

  // klavye simülasyonu: sanal sensör değerlerini güncelle (DÜZELTİLMİŞ yönler)
  const adim = 60 * dt;   // °/s
  if (tuslar['ArrowUp']) sanal.pitch = Math.min(45, sanal.pitch + adim);
  if (tuslar['ArrowDown']) sanal.pitch = Math.max(-45, sanal.pitch - adim);
  if (tuslar['ArrowLeft']) sanal.roll = Math.max(-45, sanal.roll - adim);   // sol ← (düzeltildi)
  if (tuslar['ArrowRight']) sanal.roll = Math.min(45, sanal.roll + adim);  // sağ → (düzeltildi)

  // kaynak seçimi: klavye modu açıksa sanal değer, değilse ham sensör
  const hedefPitch = klavyeModu ? sanal.pitch : ham.pitch;
  const hedefRoll = klavyeModu ? sanal.roll : ham.roll;

  // EMA yumuşatma
  yumusak.pitch += (hedefPitch - yumusak.pitch) * EMA_ALFA;
  yumusak.roll += (hedefRoll - yumusak.roll) * EMA_ALFA;

  // kalibrasyon offseti + ölü bant
  let pitchEtkili = yumusak.pitch - ofset.pitch;
  let rollEtkili = yumusak.roll - ofset.roll;
  if (Math.abs(pitchEtkili) < DEADBAND_DERECE) pitchEtkili = 0;
  if (Math.abs(rollEtkili) < DEADBAND_DERECE) rollEtkili = 0;

  // --- uçuş dinamiği ---
  yaw -= THREE.MathUtils.degToRad(rollEtkili) * DONUS_KAZANCI * dt;
  const dikeyHiz = pitchEtkili * TIRMANIS_KAZANCI;
  const ileri = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const yeniY = Math.max(0.8, konum.y + dikeyHiz * dt);
  // Çarpışmalı ilerleme: kaydırmalı (önce tam adım, sonra x/z ayrı ayrı)
  const yaricap = 2.5;
  const adimYol = HIZ_MS * dt;
  const hedefX = konum.x + ileri.x * adimYol, hedefZ = konum.z + ileri.z * adimYol;
  if (!carpismaVar(hedefX, hedefZ, yeniY, yaricap)) {
    konum.x = hedefX; konum.z = hedefZ;
  } else {
    if (!carpismaVar(hedefX, konum.z, yeniY, yaricap)) konum.x = hedefX;
    else if (!carpismaVar(konum.x, hedefZ, yeniY, yaricap)) konum.z = hedefZ;
    sonCarpismaMs = performance.now();
  }
  konum.y = yeniY;
  // kampüs sınırı
  const yatay = Math.hypot(konum.x, konum.z);
  if (yatay > SINIR_YARICAP) {
    konum.x *= SINIR_YARICAP / yatay;
    konum.z *= SINIR_YARICAP / yatay;
  }

  // uçağı yerleştir + görsel olarak eğ
  ucak.position.copy(konum);
  ucak.rotation.y = yaw;
  ucak.rotation.x = THREE.MathUtils.degToRad(pitchEtkili);
  ucak.rotation.z = -THREE.MathUtils.degToRad(rollEtkili);

  // --- kameralar ---
  if (kameraModu === 'takip') {
    const arka = ileri.clone().multiplyScalar(-9).add(new THREE.Vector3(0, 3.2, 0));
    const ideal = konum.clone().add(arka);
    kamera.position.lerp(ideal, 0.08);
    kamera.lookAt(konum.x, konum.y + 1, konum.z);
  } else {
    const burun = konum.clone().addScaledVector(ileri, 2.2);
    burun.y += 0.9;
    kamera.position.copy(burun);
    // Kokpit bakışı pitch'i kısmen takip eder (0.7): yukarı/aşağı bakınca
    // ufuk da o yöne kayar. 1.0 = birebir, 0 = eski düz bakış.
    const bakisPitch = THREE.MathUtils.degToRad(pitchEtkili * 0.7);
    const bakisYonu = new THREE.Vector3(
      -Math.sin(yaw) * Math.cos(bakisPitch),
      Math.sin(bakisPitch),
      -Math.cos(yaw) * Math.cos(bakisPitch));
    kamera.lookAt(konum.clone().addScaledVector(bakisYonu, 60));
  }

  poiGuncelle();
  durumGuncelle();
  renderer.render(sahne, kamera);
}
dongu();

addEventListener('resize', () => {
  kamera.aspect = innerWidth / innerHeight;
  kamera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

wsBaglan(true);
</script>
